name: Repair submission ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-submission-zip.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate ICLR ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f submission-zips/mldr_iclr2027.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('iclr2027')
          out = Path('submission-zips/mldr_iclr2027.zip')
          files = sorted(p for p in root.rglob('*') if p.is_file())

          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in files:
                  zf.write(path, path.relative_to(root).as_posix())
          PY
          unzip -t submission-zips/mldr_iclr2027.zip
          sha256sum submission-zips/mldr_iclr2027.zip

      - name: Commit repaired archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submission-zips/mldr_iclr2027.zip
          if git diff --cached --quiet; then
            echo 'No archive change to commit.'
            exit 0
          fi
          git commit -m 'Fix corrupted ICLR submission ZIP'
          git push
