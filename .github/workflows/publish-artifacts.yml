name: Publish generated manuscript artifacts

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/publish-artifacts.yml'

permissions:
  contents: write

jobs:
  build-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[skip artifacts]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra lmodern zip unzip
      - name: Build and verify complete artifact
        run: make all
      - name: Commit generated packages, ZIPs, PDF, and release hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f arxiv iclr2027 submission-zips mechanistic_localization_is_distribution_relative.pdf releases/v1.0/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
          else
            git commit -m "Build public manuscript artifacts [skip artifacts]"
            git push origin HEAD:main
          fi
