name: Build paper PDF

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/publish-artifacts.yml'

permissions:
  contents: write

jobs:
  build-pdf:
    if: ${{ !contains(github.event.head_commit.message, '[skip pdf]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra zip unzip
      - name: Build identified paper
        run: make paper
      - name: Commit current PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f mechanistic_localization_is_distribution_relative.pdf
          if git diff --cached --quiet; then
            echo "The manuscript PDF is already current."
          else
            git commit -m "Update manuscript PDF [skip pdf]"
            git push origin HEAD:main
          fi
