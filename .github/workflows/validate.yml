name: Validate public research artifact

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra lmodern zip unzip poppler-utils
      - name: Run finite regressions
        run: make check
      - name: Build standalone packages
        run: make packages
      - name: Compile ICLR package
        run: make iclr
      - name: Compile arXiv package
        run: make arxiv
      - name: Reject unresolved references and citations
        run: |
          for log in iclr2027/main.log arxiv/main.log; do
            if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations" "$log"; then
              echo "Unresolved references or citations in $log"
              exit 1
            fi
          done
      - name: Enforce ICLR main-text page gate
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          aux = Path('iclr2027/main.aux').read_text(errors='ignore')
          m = re.search(r'\\newlabel\{sec:main-text-end\}\{\{[^}]*\}\{(\d+)\}', aux)
          if not m:
              raise SystemExit('Could not resolve sec:main-text-end page label')
          page = int(m.group(1))
          print(f'ICLR counted main text ends on page {page}')
          if page > 9:
              raise SystemExit('ICLR main text exceeds 9 pages')
          PY
      - name: Verify standalone package manifests
        run: make verify
      - name: Build root identified PDF
        run: make pdf
      - name: PDF preflight
        run: |
          pdfinfo mechanistic_localization_is_distribution_relative.pdf >/dev/null
          pdfinfo iclr2027/main.pdf >/dev/null
