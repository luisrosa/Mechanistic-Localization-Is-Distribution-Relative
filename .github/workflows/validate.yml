name: Build and check paper

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra zip unzip poppler-utils
      - name: Run finite checks
        run: make check
      - name: Build identified and anonymous manuscripts
        run: make submission
      - name: Reject unresolved references and citations
        run: |
          for log in arxiv/main.log iclr2027/main.log; do
            if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations" "$log"; then
              echo "Unresolved references or citations in $log"
              exit 1
            fi
          done
      - name: Enforce ICLR main-text page limit
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          aux = Path('iclr2027/main.aux').read_text(errors='ignore')
          m = re.search(r'\\newlabel\{sec:main-text-end\}\{\{[^}]*\}\{(\d+)\}', aux)
          if not m:
              raise SystemExit('Could not resolve sec:main-text-end page label')
          page = int(m.group(1))
          print(f'ICLR main text ends on page {page}')
          if page > 9:
              raise SystemExit('ICLR main text exceeds 9 pages')
          PY
      - name: Build public PDF
        run: make paper
      - name: PDF preflight
        run: |
          pdfinfo paper.pdf >/dev/null
          pdfinfo iclr2027/main.pdf >/dev/null
